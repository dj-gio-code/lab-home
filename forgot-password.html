<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-left: #e8e6e0;
    --orange: #f5692a;
    --purple: #6c4fe0;
    --yellow: #f5c842;
    --dark:   #1a1a1a;
    --form-bg: #ffffff;
    --text-main: #1a1a1a;
    --text-muted: #999;
    --border: #e0ddd6;
    --btn: #1a1a1a;
  }

  html, body { height: 100%; font-family: 'DM Sans', sans-serif; }

  body {
    display: flex;
    min-height: 100vh;
    background: var(--form-bg);
  }

  /* LEFT */
  .left {
    flex: 0 0 55%;
    background: var(--bg-left);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  .stage {
    position: relative;
    width: 340px;
    height: 300px;
  }

  /* Characters — same as login */
  .char-orange {
    position: absolute; bottom: 0; left: 10px;
    width: 130px; height: 130px;
    transform-origin: bottom center;
    animation: bob 2.8s ease-in-out infinite;
  }
  .char-orange .body {
    width: 130px; height: 130px;
    background: var(--orange); border-radius: 50%; position: relative;
  }
  .char-orange .face {
    position: absolute; top: 38%; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 14px; align-items: center;
  }

  .char-purple {
    position: absolute; bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 90px; height: 200px;
    transform-origin: bottom center;
    animation: bob 2.4s ease-in-out infinite 0.3s;
  }
  .char-purple .body {
    width: 90px; height: 200px;
    background: var(--purple);
    border-radius: 18px 18px 6px 6px; position: relative;
  }
  .char-purple .face {
    position: absolute; top: 18%; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 12px; align-items: center;
  }

  .char-yellow {
    position: absolute; bottom: 0; right: 10px;
    width: 85px; height: 110px;
    transform-origin: bottom center;
    animation: bob 3.1s ease-in-out infinite 0.7s;
  }
  .char-yellow .body {
    width: 85px; height: 110px;
    background: var(--yellow);
    border-radius: 50% 50% 8px 8px / 40% 40% 8px 8px; position: relative;
  }
  .char-yellow .face {
    position: absolute; top: 30%; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 10px; align-items: center;
  }

  .eye {
    width: 10px; height: 10px;
    background: var(--dark); border-radius: 50%;
    flex-shrink: 0;
  }

  /* sad eyes — for the "thinking/worried" state */
  .sad-eye {
    position: relative;
  }
  .sad-eye::before {
    content: '';
    position: absolute;
    top: -4px; left: 50%;
    transform: translateX(-50%);
    width: 12px; height: 4px;
    background: var(--dark);
    border-radius: 2px 2px 0 0;
  }

  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%       { transform: translateY(-8px); }
  }
  .char-purple { animation: bob 2.4s ease-in-out infinite 0.3s !important; }

  /* success bounce */
  @keyframes jump {
    0%   { transform: translateY(0); }
    30%  { transform: translateY(-24px); }
    55%  { transform: translateY(0); }
    70%  { transform: translateY(-10px); }
    85%  { transform: translateY(0); }
    100% { transform: translateY(0); }
  }
  .jumping { animation: jump 0.8s ease forwards !important; }
  .char-purple.jumping { animation: jump 0.8s ease 0.1s forwards !important; }

  /* RIGHT */
  .right {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 56px;
    position: relative;
  }

  .logo-cross {
    position: absolute; top: 32px; left: 50%;
    transform: translateX(-50%);
    font-size: 28px; font-weight: 300;
    color: var(--text-main); line-height: 1;
    user-select: none;
  }

  .back-link {
    position: absolute; top: 32px; left: 32px;
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--text-muted);
    text-decoration: none;
    transition: color 0.2s;
  }
  .back-link:hover { color: var(--text-main); }
  .back-link svg { width: 16px; height: 16px; }

  .form-wrap {
    width: 100%;
    max-width: 340px;
  }

  /* Icon top */
  .icon-wrap {
    width: 52px; height: 52px;
    background: #f4f2ed;
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 24px;
  }
  .icon-wrap svg { width: 24px; height: 24px; color: var(--text-main); }

  .form-wrap h1 {
    font-size: 26px; font-weight: 600;
    color: var(--text-main); margin-bottom: 8px;
    letter-spacing: -0.02em;
  }

  .form-wrap .subtitle {
    font-size: 14px; color: var(--text-muted);
    font-weight: 300; margin-bottom: 32px;
    line-height: 1.6;
  }

  .field { margin-bottom: 20px; }

  .field label {
    display: block; font-size: 12px; font-weight: 500;
    color: var(--text-muted); margin-bottom: 6px;
    letter-spacing: 0.03em;
  }

  .field input {
    width: 100%; height: 44px;
    border: 1.5px solid var(--border);
    border-radius: 8px; padding: 0 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px; color: var(--text-main);
    background: #fff; outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .field input:focus {
    border-color: var(--dark);
    box-shadow: 0 0 0 3px rgba(26,26,26,0.06);
  }

  /* Messages */
  .msg {
    display: none;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    margin-bottom: 14px;
    line-height: 1.5;
  }
  .msg.error   { background: #fff0f0; border: 1px solid #fcc; color: #c0392b; }
  .msg.success { background: #f0faf4; border: 1px solid #a8dfc0; color: #1a7a45; }

  .btn-reset {
    width: 100%; height: 46px;
    background: var(--btn); color: #fff;
    border: none; border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px; font-weight: 500;
    cursor: pointer; letter-spacing: 0.01em;
    transition: background 0.2s, transform 0.15s;
    margin-bottom: 16px;
  }
  .btn-reset:hover   { background: #2d2d2d; }
  .btn-reset:active  { transform: scale(0.98); }
  .btn-reset:disabled { opacity: 0.6; cursor: wait; }

  .back-to-login {
    text-align: center; font-size: 13px; color: var(--text-muted);
  }
  .back-to-login a {
    color: var(--text-main); font-weight: 500;
    text-decoration: none;
    border-bottom: 1px solid var(--text-main);
    padding-bottom: 1px;
    transition: opacity 0.2s;
  }
  .back-to-login a:hover { opacity: 0.6; }

  /* Success state — replaces form */
  .success-state {
    display: none;
    text-align: center;
  }
  .success-state .check-circle {
    width: 64px; height: 64px;
    background: #f0faf4;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px;
  }
  .success-state .check-circle svg {
    width: 28px; height: 28px; color: #1a7a45;
  }
  .success-state h2 {
    font-size: 22px; font-weight: 600;
    color: var(--text-main); margin-bottom: 10px;
    letter-spacing: -0.02em;
  }
  .success-state p {
    font-size: 14px; color: var(--text-muted);
    line-height: 1.6; margin-bottom: 28px;
  }
  .success-state a {
    display: inline-block;
    font-size: 14px; font-weight: 500;
    color: var(--text-main);
    text-decoration: none;
    border-bottom: 1px solid var(--text-main);
    padding-bottom: 2px;
    transition: opacity 0.2s;
  }
  .success-state a:hover { opacity: 0.6; }

  @media (max-width: 700px) {
    body { flex-direction: column; }
    .left { flex: 0 0 200px; }
    .right { padding: 40px 24px; }
  }
</style>
</head>
<body>

<!-- LEFT: Characters -->
<div class="left">
  <div class="stage">
    <div class="char-orange" id="charOrange">
      <div class="body">
        <div class="face" id="faceOrange">
          <div class="eye sad-eye"></div>
          <div class="eye sad-eye"></div>
        </div>
      </div>
    </div>
    <div class="char-purple" id="charPurple">
      <div class="body">
        <div class="face" id="facePurple">
          <div class="eye sad-eye"></div>
          <div class="eye sad-eye"></div>
        </div>
      </div>
    </div>
    <div class="char-yellow" id="charYellow">
      <div class="body">
        <div class="face" id="faceYellow">
          <div class="eye sad-eye"></div>
          <div class="eye sad-eye"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- RIGHT: Form -->
<div class="right">
  <div class="logo-cross">+</div>

  <a href="login.html" class="back-link">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M12 5l-7 7 7 7"/>
    </svg>
    Torna al login
  </a>

  <div class="form-wrap">

    <!-- FORM STATE -->
    <div id="formState">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <h1>Password dimenticata?</h1>
      <p class="subtitle">Inserisci la tua email e ti mandiamo un link per reimpostarla.</p>

      <div id="errorMsg"  class="msg error"></div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="anna@gmail.com" autocomplete="email">
      </div>

      <button class="btn-reset" id="btnReset">Invia link di reset</button>

      <p style="font-size:12px; color:#999; text-align:center; margin-top:10px; line-height:1.5;">
        📬 Controlla anche la cartella <strong>spam / posta indesiderata</strong>
      </p>

      <p class="back-to-login">Ricordi la password? <a href="login.html">Accedi</a></p>
    </div>

    <!-- SUCCESS STATE -->
    <div class="success-state" id="successState">
      <div class="check-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <h2>Email inviata!</h2>
      <p id="successText">Controlla la tua casella e clicca sul link per reimpostare la password.</p>
      <a href="login.html">← Torna al login</a>
    </div>

  </div>
</div>

<script type="module">
  import { initializeApp }           from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getAuth, sendPasswordResetEmail } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

  const firebaseConfig = {
    apiKey:            "AIzaSyCQlHzl9LwjuHgBa0702_bwpvnNgRSfSnw",
    authDomain:        "portafoglio-proggetti.firebaseapp.com",
    projectId:         "portafoglio-proggetti",
    storageBucket:     "portafoglio-proggetti.firebasestorage.app",
    messagingSenderId: "1081645087006",
    appId:             "1:1081645087006:web:28fb12b11e12189f99f10f"
  };

  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const emailInput  = document.getElementById('email');
  const btnReset    = document.getElementById('btnReset');
  const errorMsg    = document.getElementById('errorMsg');
  const formState   = document.getElementById('formState');
  const successState = document.getElementById('successState');
  const successText  = document.getElementById('successText');

  const charOrange = document.getElementById('charOrange');
  const charPurple = document.getElementById('charPurple');
  const charYellow = document.getElementById('charYellow');

  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.style.display = 'block';
  }
  function hideError() { errorMsg.style.display = 'none'; }

  function firebaseError(code) {
    const map = {
      'auth/user-not-found':  'Nessun account trovato con questa email.',
      'auth/invalid-email':   'Indirizzo email non valido.',
      'auth/too-many-requests': 'Troppe richieste. Attendi qualche minuto.',
      'auth/network-request-failed': 'Errore di rete. Controlla la connessione.',
    };
    return map[code] || 'Errore: ' + code;
  }

  function jumpChars() {
    [charOrange, charPurple, charYellow].forEach((c, i) => {
      setTimeout(() => {
        c.classList.add('jumping');
        // rimuovi sad-eye
        c.querySelectorAll('.eye').forEach(e => e.classList.remove('sad-eye'));
      }, i * 80);
    });
  }

  btnReset.addEventListener('click', async () => {
    hideError();
    const email = emailInput.value.trim();

    if (!email) { showError('Inserisci la tua email.'); return; }

    btnReset.disabled = true;
    btnReset.textContent = 'Invio in corso…';

    try {
      await sendPasswordResetEmail(auth, email);

      jumpChars();

      // Mostra success dopo un attimo (lasciar vedere il salto)
      setTimeout(() => {
        formState.style.display = 'none';
        successState.style.display = 'block';
        successText.textContent = `Abbiamo inviato un link a ${email}. Controlla anche la cartella spam/posta indesiderata.`;
      }, 900);

    } catch (err) {
      showError(firebaseError(err.code));
      btnReset.disabled = false;
      btnReset.textContent = 'Invia link di reset';
    }
  });

  emailInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') btnReset.click();
  });
</script>
</body>
</html>
